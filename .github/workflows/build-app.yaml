name: Build app

# Reusable: build the app image for every architecture, smoke-test it, and
# (when publishing) push the per-arch images and the multi-arch manifest.
# A version that is already published is never pushed again: one tag, one
# image, as the Supervisor expects.

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      ref:
        description: Git ref to build (defaults to the triggering commit)
        required: false
        type: string
        default: ""
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      published:
        value: ${{ jobs.manifest.result == 'success' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
          DESCRIPTION: ${{ steps.info.outputs.description }}
          URL: ${{ steps.info.outputs.url }}
        run: |
          # The info helper returns JSON-encoded strings ("..."); unquote them.
          unquote() { local v="$1"; v="${v#\"}"; v="${v%\"}"; printf '%s' "$v"; }
          IMAGE="$(unquote "$IMAGE")"; VERSION="$(unquote "$VERSION")"
          NAME="$(unquote "$NAME")"; DESCRIPTION="$(unquote "$DESCRIPTION")"; URL="$(unquote "$URL")"
          {
            echo "image=${IMAGE}"
            echo "image_name=${IMAGE##*/}"
            echo "registry_prefix=${IMAGE%/*}"
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION}"
            if [[ -n "$URL" && "$URL" != "null" ]]; then echo "url=${URL}"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Is this version already published?
        id: exists
        env:
          IMAGE: ${{ steps.normalize.outputs.image }}
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${VERSION} is already published; it will not be pushed again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  smoke:
    name: Smoke test (amd64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build and start the app like the Supervisor does
        run: scripts/smoke.sh "./${{ inputs.app }}"

  build:
    name: Build ${{ matrix.arch }} image
    needs: [prepare, smoke]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish && needs.prepare.outputs.exists != 'true' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish && needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
